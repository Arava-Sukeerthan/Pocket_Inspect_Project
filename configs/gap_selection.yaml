# Declarative inputs for research/gap_analysis/final_gap_selection_matrix.csv and
# final_gap_selection.md, validated by src/literature/gap_selection.py.
#
# Phase A builds the framework and evaluates the candidates. It does NOT rank,
# score, weight or select a candidate. Selection (Phase B) requires explicit
# researcher approval and is not performed by this workflow.

