  F: Research-question clarity
  G: Dataset feasibility
  H: Smartphone hardware feasibility
  I: Measurement feasibility
  J: Baseline availability
  K: Experimental depth
  L: Ablation potential
  M: Contribution distinctiveness
  N: Reproducibility
  O: Implementation complexity
  P: Publication potential
