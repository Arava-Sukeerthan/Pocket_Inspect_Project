  - Falsification-surviving
  - Scientifically precise
  - PocketInspect alignment
  - Experimentally testable
  - Reproducible
  - Dataset-feasible
  - Hardware-feasible
  - Baseline-feasible
  - Contribution clarity
  - Evaluation depth
  - Publication defensibility

# Selection gate (Part XI). Status vocabulary is qualitative; no aggregation.
gate_status_values: [satisfied, partially_satisfied, not_satisfied, unresolved]
gate_questions:
  Q1: Is the evidence strong enough?
  Q2: Is the Unknown burden acceptable?
  Q3: Are counterexamples sufficiently understood?
  Q4: Is the gap precise?
  Q5: Is the research question testable?
  Q6: Is the dataset feasible?
  Q7: Is smartphone experimentation feasible?
  Q8: Can the contribution be distinguished from prior integration?
  Q9: Can the study produce quantitative evidence?
  Q10: Could additional literature reasonably overturn the candidate?
selection_gate:
  GC-01:
    Q1: [partially_satisfied, "Corpus observation holds (resource_awareness/adaptive_inference Yes 0 in scope) and survived 15 targeted searches, but rests on 4 verified No records and 1 verified smartphone visual-inspection paper (P011)."]
    Q2: [unresolved, "23/27 in-scope records Unknown per runtime field; acceptable only under the corpus-bounded framing; P001 unresolved."]
    Q3: [satisfied, "Partial counterexamples (arXiv 2608.14727, PMC11435656, SAEC) are characterised: content- or confidence-driven, not smartphone."]
    Q4: [satisfied, "Narrowed wording fixes platform (smartphone), task (visual inspection) and trigger (device/resource state)."]
    Q5: [satisfied, "Candidate RQs compare resource-driven, content-driven and static policies on measurable outcomes."]
    Q6: [partially_satisfied, "Public optical datasets exist in the repository record; no smartphone-captured inspection dataset is identified; licences/access not verified."]
    Q7: [partially_satisfied, "Android exposes thermal/battery state (Assumption to verify on the target device); device availability is an Assumption."]
    Q8: [unresolved, "Resource-driven adaptation mechanisms exist on smartphones outside inspection (P029, P033, P034); whether inspection changes the problem is a Hypothesis."]
    Q9: [satisfied, "Accuracy, latency, throttling and resource traces are quantitative."]
    Q10: [unresolved, "Plausible: generic mobile adaptive-inference literature is large and indexed databases were not searched."]
  GC-02:
    Q1: [partially_satisfied, "No in-scope or core paper is coded Yes for both energy and thermal; survived 15 targeted searches; evidence rests on 4 verified No records."]
    Q2: [unresolved, "23/27 in-scope records Unknown for energy and for thermal; P007 unresolved."]
    Q3: [satisfied, "TinyGLASS (edge energy only), SAEC (energy, no thermal, not smartphone) and arXiv 2603.26603 (smartphone energy + temperature, LLM workload) are characterised."]
    Q4: [satisfied, "Narrowed wording requires joint energy and thermal measurement of resource-adaptive smartphone inspection."]
    Q5: [satisfied, "Candidate RQs test whether energy-only and thermal-aware evaluation lead to different conclusions; falsifiable."]
    Q6: [partially_satisfied, "Energy/thermal behaviour is workload-driven, so public datasets can drive the workload; inspection accuracy on phone-captured data needs custom capture."]
    Q7: [partially_satisfied, "BatteryManager-based logging is shown on an unrooted phone (arXiv 2603.26603, LLM workload); accuracy versus an external meter is unverified for the target device."]
    Q8: [unresolved, "Risk that the contribution is primarily benchmarking unless the joint measurement changes a design conclusion (Hypothesis)."]
    Q9: [satisfied, "Energy per inspected item, temperature trajectories and time-to-throttling are quantitative."]
    Q10: [unresolved, "Plausible: mobile energy/thermal measurement studies are numerous; an inspection-specific study could exist in unsearched venues."]
  GC-03:
    Q1: [partially_satisfied, "No in-corpus paper meets three of the Step 9.7 components; survived 16 targeted searches; confidence_gating evidence in scope is Yes 1 (P016)."]
    Q2: [partially_satisfied, "Step 9.9B: Conditionally acceptable. The remaining Unknown burden is acceptable for a corpus-bounded candidate-gap statement, provided unresolved high-impact papers such as P001 and AIVD are explicitly retained as limitations. The evidence does not justify a universal claim that no counterexample exists. Limitations kept: P001, AIVD and Choi 2026 full texts unresolved; database access substituted rather than direct; English-only; one results page per search; remaining Unknown burden; ActiveInspect confidence-gating interpretation remains an operational-definition issue. Not absolute proof."]
    Q3: [partially_satisfied, "Five partial counterexamples characterised; PMC11435656 and ActiveInspect were keyword-scanned, so some fields remain Unknown."]
    Q4: [satisfied, "Narrowed wording names five components."]
    Q5: [partially_satisfied, "Testable with a rig or scripted recapture; user-in-the-loop recapture adds variability."]
    Q6: [partially_satisfied, "Multi-view datasets exist (Real-IAD, MANTA, P037/P038); smartphone recapture or multi-view data are not identified and would need custom acquisition."]
    Q7: [partially_satisfied, "Same device Assumptions as GC-01, plus an acquisition-feedback loop (app UI or rig)."]
    Q8: [partially_satisfied, "Step 9.9B: Conditionally distinct. The individual mechanisms already exist in the literature, and integration alone is not sufficient novelty. The potentially distinctive contribution is the experimentally testable question of whether confidence-aware verification can recover inspection performance lost when resource-driven adaptation downgrades a smartphone inspection configuration, including whether confidence calibration changes across configurations. Limitations kept: P001, AIVD and Choi 2026 full texts unresolved; database access substituted rather than direct; English-only; one results page per search; remaining Unknown burden; ActiveInspect confidence-gating interpretation remains an operational-definition issue. Not absolute proof."]
    Q9: [satisfied, "Recall at fixed review rate, referral/recapture rates, calibration error, latency and resource use are quantitative."]
    Q10: [partially_satisfied, "Step 9.9B: Moderate. Additional literature could overturn the candidate if a single study demonstrates smartphone-based optical inspection, device-state-driven runtime configuration changes, and confidence-triggered downstream recapture or escalation in one system. P001, AIVD, and Choi 2026 remain particularly important unresolved evidence. Limitations kept: P001, AIVD and Choi 2026 full texts unresolved; database access substituted rather than direct; English-only; one results page per search; remaining Unknown burden; ActiveInspect confidence-gating interpretation remains an operational-definition issue. Not absolute proof."]

