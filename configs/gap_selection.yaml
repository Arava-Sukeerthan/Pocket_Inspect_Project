# Candidate research questions (NOT final PocketInspect RQs).
rq_status: "Candidate research question (not final)"
candidate_research_questions:
  GC-01:
    - id: GC-01-RQ1
      type: primary
      text: "On a resource-constrained Android smartphone running a fixed optical inspection task, does a runtime policy that switches model variant and/or input resolution based on measured device state (thermal status, battery level, CPU load) keep defect-detection performance within a pre-registered tolerance of the best static configuration while reducing latency degradation over sustained inspection sessions?"
      measurable_outcomes: [defect recall at fixed false-positive rate, image-level AUROC or F1, p50/p95 latency over time, throughput degradation under throttling]
      falsified_if: "The resource-driven policy shows no reduction in sustained-session latency degradation relative to the best static configuration, or its accuracy loss exceeds the pre-registered tolerance."
    - id: GC-01-RQ2
      type: secondary
      text: "Which device-resource signals (thermal status, battery level, CPU/memory load), used alone or combined, produce measurably different accuracy-latency trade-offs when driving runtime adaptation for smartphone inspection?"
      measurable_outcomes: [accuracy-latency trade-off per signal configuration, number of adaptation switches, time spent in throttled states]
      falsified_if: "All signal configurations produce trade-offs indistinguishable within run-to-run variance."
    - id: GC-01-RQ3
      type: evaluation
      text: "How do resource-driven, content-driven and static configurations compare on accuracy, latency and throttling behaviour under controlled thermal and battery conditions?"
      measurable_outcomes: [accuracy, latency distribution, throttling onset time, battery drain per inspected item]
      falsified_if: "Resource-driven and content-driven policies yield the same outcomes within variance across all tested conditions."
  GC-02:
    - id: GC-02-RQ1
      type: primary
      text: "For resource-adaptive optical inspection on a resource-constrained smartphone, do energy-only and joint energy-plus-thermal evaluations lead to different conclusions about which configuration sustains the target inspection throughput over a fixed session length?"
      measurable_outcomes: [energy per inspected item, device/battery temperature trajectory, time to thermal throttling, sustained throughput]
      falsified_if: "Energy-only and joint energy-thermal evaluations select the same configurations under all tested sustained workloads."
    - id: GC-02-RQ2
      type: secondary
      text: "How do energy per inspected item and thermal trajectory change between static and resource-adaptive inspection configurations under sustained workloads at controlled ambient temperature?"
      measurable_outcomes: [energy per inspected item, peak and mean temperature, time to throttling, accuracy]
      falsified_if: "No measurable difference in energy or thermal trajectory between static and adaptive configurations beyond run-to-run variance."
    - id: GC-02-RQ3
      type: evaluation
      text: "How closely does on-device software energy logging (Android BatteryManager) agree with an external power measurement for inspection workloads on the target smartphone?"
      measurable_outcomes: [agreement between software and external energy estimates, bias and variance across runs]
      falsified_if: "Not a hypothesis test in itself; it establishes the measurement validity required by RQ1 and RQ2."
  GC-03:
    - id: GC-03-RQ1
      type: primary
      text: "Can confidence-aware downstream verification recover inspection accuracy lost when a resource-constrained smartphone dynamically downgrades its inference configuration under changing device conditions?"
      phase_a_text: "Under resource-driven runtime downgrades on a resource-constrained smartphone, does a confidence-triggered verification action (recapture, additional view, or escalation to a larger on-device model) recover defect recall to within a pre-registered tolerance of the full-capacity configuration, and at what added latency and energy cost?"
      measurable_outcomes: [recall, precision, F1, mAP where appropriate, calibration error, latency, energy/power, temperature, memory, recapture rate, escalation rate]
      independent_variables: [resource/device state, selected inference configuration, adaptation state]
      dependent_variables: [recall, precision, F1, mAP where appropriate, calibration/error, latency, energy/power, temperature, memory, recapture rate, escalation rate]
      potential_mediator: confidence threshold / uncertainty
      falsified_if: "Confidence-triggered verification does not recover recall beyond the downgraded baseline, or recovers it only at a cost equal to running the full-capacity configuration."
    - id: GC-03-RQ2
      type: secondary
      text: "Does the confidence calibration of the inspection model change across resource-adaptive configurations, and does per-configuration threshold recalibration change verification trigger rates and residual error?"
      measurable_outcomes: [expected calibration error per configuration, risk-coverage curves, trigger rate, residual error rate]
      falsified_if: "Calibration error and trigger behaviour are unchanged across configurations within variance."
    - id: GC-03-RQ3
      type: evaluation
      text: "What are the risk-coverage and operator-workload trade-offs of combining resource-driven adaptation with confidence-aware verification, compared with each component alone?"
      measurable_outcomes: [risk-coverage curve, referral rate, recall at fixed referral rate, latency, energy]
      falsified_if: "The combination is not distinguishable from the better single component on any measured trade-off."

candidate_hypotheses:
  GC-01:
    - "H-GC01-1 (Hypothesis): A device-state-driven policy reduces sustained-session latency degradation relative to the best static configuration with accuracy loss within a pre-registered tolerance."
    - "H-GC01-2 (Hypothesis): Thermal-status signals contribute more to sustained performance than battery level on the tested devices."
  GC-02:
    - "H-GC02-1 (Hypothesis): Energy-optimal and thermally sustainable configurations differ for at least one tested inspection workload."
  # Step 9.9C: H1-H5 replace H-GC03-1 (now H4) and H-GC03-2 (now H2 and H5).
  GC-03:
    - "H1 (CANDIDATE — NOT YET TESTED): Resource-driven runtime downgrading decreases inspection performance relative to the best static configuration under equivalent task conditions."
    - "H2 (CANDIDATE — NOT YET TESTED): Confidence-aware downstream verification recovers a measurable portion of the performance degradation introduced by resource-driven downgrading."
    - "H3 (CANDIDATE — NOT YET TESTED): Confidence-aware verification introduces measurable computational and/or energy/latency overhead."
    - "H4 (CANDIDATE — NOT YET TESTED): Confidence distributions and calibration characteristics differ between inference configurations operating under different resource conditions."
    - "H5 (CANDIDATE — NOT YET TESTED): A joint resource-adaptation + confidence-verification policy provides a more favorable accuracy–efficiency trade-off than either mechanism alone."

