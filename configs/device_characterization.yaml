# Step 10D: Device Characterization Procedural Configuration.
#
# Defines procedural parameters, probe paths, and collector configurations
# for characterizing the experimental platform (OPPO A5 2020, 3 GB RAM).
#
# Procedure settings only; contains no model thresholds, model ladder,
# benchmark latency, or performance results.

step: "10D"
status: "implementation_configured"

device_unit_id: "OPPO_A5_2020_UNIT_01"

known_specification:
  manufacturer: "OPPO"
  model: "OPPO A5 2020"
  ram_variant: "3 GB"
  excluded_variants:
    - "4 GB"
    - "6 GB"
  storage: "64 GB"
  soc: "Qualcomm Snapdragon 665"
  gpu: "Adreno 610"
  android_launch_version: "Android 9 / ColorOS"
  source: "researcher-provided manufacturer specification"

procedural_parameters:
  polling_interval_ms: 1000          # 1 Hz sampling for observation windows
  observation_window_seconds: 30     # 30-second window per telemetry check
  repeat_runs_required: 2            # Two characterization runs required
  repeat_min_separation_hours: 12    # Separate days / reboot between runs
  adb_timeout_seconds: 15            # ADB shell command timeout

enabled_collectors:
  - device_identity
  - android_capability
  - battery_telemetry
  - memory_telemetry
  - cpu_telemetry
  - gpu_telemetry
  - thermal_telemetry
  - camera_capability
  - inference_backend_capability
  - profiling_capability
  - energy_measurement_checker

probes:
  # Host (adb shell) probe paths. Every host sysfs/procfs path the collector reads comes from here.
  cpufreq_sysfs_pattern: "/sys/devices/system/cpu/cpu%d/cpufreq/scaling_cur_freq"   # cpu0 current-frequency record
  cpufreq_policy_dir: "/sys/devices/system/cpu/cpufreq"        # one policyN directory per CPU group
  cpufreq_policy_files:                                         # read for every policy (frequency observability, protocol §5.7 C)
    - "scaling_cur_freq"
    - "scaling_max_freq"
    - "cpuinfo_max_freq"
  thermal_sysfs_pattern: "/sys/class/thermal/thermal_zone%d"
  thermal_zone_scan_count: 10                                   # zones thermal_zone0 .. thermal_zone9 are read
  kgsl_gpu_clock_path: "/sys/class/kgsl/kgsl-3d0/gpuclk"
  kgsl_gpu_busy_path: "/sys/class/kgsl/kgsl-3d0/gpubusy"        # readability only; meaning is not interpreted in Step 10D
  psi_memory_path: "/proc/pressure/memory"
  kernel_release_command: ["uname", "-r"]

# Camera advertised-vs-honoured check (protocol §4 P3, §5.3).
# The Android app requests locked manual exposure/sensitivity and reports requested and CaptureResult values;
# the host decides "honoured" from them: abs(reported - requested) <= tolerance * requested, checked separately
# for exposure time and for sensitivity; both must hold. Tolerances are relative (fractions of the requested value).
# Researcher decision (2026-10-07), approved as F-01: ±5 % for both. 0.0 would mean exact equality.
# Capability-validation acceptance thresholds, not model-performance or accuracy targets.
camera_manual_control_check:
  exposure_time_relative_tolerance: 0.05
  sensitivity_relative_tolerance: 0.05

# Runtime / backend capability check (protocol §4 P4, §5.4, §5.5; matrix §5). Capability only: no latency,
# throughput or accuracy is recorded.
# Researcher decision F-02 (2026-10-07): the Step 10D runtime capability scope is LiteRT / TensorFlow Lite
# (CPU/XNNPACK, GPU delegate, NNAPI delegate) and ONNX Runtime Mobile (CPU, NNAPI execution provider).
# No other runtime is approved or required for Step 10D.
# The Android app runs the probes (BackendProbes.kt); the host decides every status from the app's raw observations.
# Runtime artifact versions are declared once, in mobile/characterization/build.gradle.kts; the app reports the
# runtime-reported version (or null when the runtime does not report one).
inference_backend_check:
  backends:
    TFLite_CPU: {runtime_family: "LiteRT / TensorFlow Lite", artifact_format: "tflite", requested_delegate: "XNNPACK"}
    TFLite_GPU: {runtime_family: "LiteRT / TensorFlow Lite", artifact_format: "tflite", requested_delegate: "GPU"}
    TFLite_NNAPI: {runtime_family: "LiteRT / TensorFlow Lite", artifact_format: "tflite", requested_delegate: "NNAPI"}
    ONNXRuntime_CPU: {runtime_family: "ONNX Runtime Mobile", artifact_format: "onnx", requested_delegate: "CPUExecutionProvider"}
    ONNXRuntime_NNAPI: {runtime_family: "ONNX Runtime Mobile", artifact_format: "onnx", requested_delegate: "NnapiExecutionProvider"}
  # Matrix row "Other approved runtimes (e.g. ExecuTorch)": none approved (F-02). The coverage row is satisfied only
  # when every in-scope backend row passes (configs/device_capability_coverage.yaml); no runtime is added for it.
  other_approved_runtimes: []
  primary_variant: "fp32"            # availability / load / inference / probability output / delegation records
  quantization_variants: ["fp16", "int8"]   # one quantization_support record each
  # Deterministic in-repository reference graph. Definition and generator (standard library only):
  # src/monitoring/characterization/reference_graph.py. Variants fp32, fp16 (float16 weight storage), int8.
  # CONV 3x3 (3->4) -> DEPTHWISE CONV 3x3 -> AVERAGE POOL 2x2 -> FULLY CONNECTED (64->4) -> SOFTMAX;
  # input [1,8,8,3] (ONNX [1,3,8,8]), output [1,4]; fixed-formula weights and test input; no training, no download.
  # The binary artifacts are not committed (no model binaries in git, AGENTS.md): the APK build generates them
  # (Gradle task generateReferenceGraph -> APK assets reference_graph/). The app reports the SHA-256 of the bytes it
  # loaded; the host compares it with the value pinned here. Check the pins:
  #   python scripts/device_characterization/generate_reference_graph.py --check
  reference_graph:
    graph_id: "pocketinspect_step10d_reference_graph_v1"
    apk_asset_dir: "reference_graph"
    artifacts:
      reference_graph_fp32.tflite: "1010b916154c293e5a168e4d8f394092958e4b739f2b614bbcf29fdb5aeb5f72"
      reference_graph_fp16.tflite: "04995dba9755181179a208c4e4c4d7b39fc63b544e142b0bb12e0fe2ed31ab03"
      reference_graph_int8.tflite: "4f7ef2f2d5bc90a2080f458d6f27ba83ee26e96a3731910831d1eb5a20978516"
      reference_graph_fp32.onnx: "fad6dca1033903656ff0589d7470ab215a6878336f1bf6b9115e6ea6de52b55e"
      reference_graph_fp16.onnx: "528648a4cf978e8ceb0fa4a4a57695bcd4372d9cf0cbd4ea4fc5e89660a813de"
      reference_graph_int8.onnx: "ccafb6ce999a812d71626a719d70347db2bf206432391e4f91f1d653609cd0cd"
      reference_graph_manifest.json: "3c904b28e9283e1b6df766e75713c789f8150ff5f7269069c235fd97e800ed0d"
  # Output-validity rule (one rule, applied by the host to every app-reported output):
  #   output present; shape == [1, 4]; every value finite and within [0, 1];
  #   abs(sum(values) - 1) <= probability_sum_tolerance;
  #   max_i abs(value_i - expected_i) <= max_abs_error, expected = float64 reference (reference_graph.py).
  # Researcher-approved values (F-01, 2026-10-07). Capability-validation acceptance thresholds only, not
  # model-performance or accuracy targets.
  # float (fp32, fp16 variants): max abs error 0.01, sum tolerance 0.01. Half-precision execution, which the GPU
  #   delegate and NNAPI may use, gives errors of order 1e-3 on this graph; 0.01 is below the smallest gap between
  #   expected class probabilities (0.0165), so a structural error still fails. Bit-exact agreement is not required.
  # int8: 2 quantization steps per output, 4 steps for the probability sum (step = 1/256, the int8 softmax output
  #   scale); not judged with the float rule.
  output_validation:
    float:
      max_abs_error: 0.01
      probability_sum_tolerance: 0.01
    int8:
      output_scale: 0.00390625        # 1/256
      max_abs_error_lsb: 2
      probability_sum_tolerance_lsb: 4

# Energy-measurement feasibility evidence (protocol §6, D-16 hierarchy).
# E-1 and E-2 are physical/procedural checks performed by the researcher, never by software.
# Set this to the path (relative to the repository root) of a researcher-completed evidence file that follows
# configs/energy_feasibility_evidence_template.yaml. null means "not yet assessed": E-1/E-2 stay
# NOT_TESTED and no energy level is selected.
energy_feasibility_evidence: null

# Historical physical runs. The software refuses to write into these run directories, with or without --overwrite.
protected_runs:
  - "run_20261005_181140"
  - "run_20261006_052440"
  - "run_20261007_082743"

# RAM variant check (R-08, specification approved by the researcher on 2026-10-06; protocol §2).
# Nominal capacities are classification references only, never measured RAM.
# Unit: MiB (1 MiB = 1,048,576 bytes). The observed value is the existing `total_ram_mb` field,
# whose value is MiB despite the name: host floor(MemTotal_kB / 1024), app floor(totalMem / 1,048,576).
# Rule: the candidate variant is the nominal capacity at the smallest absolute distance from the
# observed RAM (midpoints: 3584 MiB between 3 GB and 4 GB, 5120 MiB between 4 GB and 6 GB).
# - Nearest is the required variant (no tie): MATCH; VERIFIED on a real-device run with valid evidence.
# - Nearest is another variant: MISMATCH; AVAILABLE, not verified; blocks Step 10D sign-off.
#   The 4 GB and 6 GB variants are never substitutes for the required variant.
# - Exact tie between two nominals: AMBIGUOUS; not verified; blocks Step 10D sign-off.
# - Non-positive or non-numeric RAM: ERROR on the variant check; blocks sign-off.
# - RAM not observed: the existing NOT_TESTED semantics apply.
# No upper sanity bound: a value above 6144 MiB is still classified as nearest 6 GB.
# Sign-off: Step 10D sign-off requires variant_check VERIFIED with nearest_variant equal to
# required_variant. run_status (execution/probe completion) is not affected by this check.
ram_variant_check:
  unit: "MiB"
  required_variant: "3 GB"
  nominal_ram_mib:
    "3 GB": 3072
    "4 GB": 4096
    "6 GB": 6144

# Run status rules (P5-05).
# Research protocol requirement: a characterization must establish the observed device identity
# (protocol §2) and the RAM needed for the 3 GB variant check (protocol §2, §9 sign-off
# criterion 2). The protocol does not say which source must supply these observations; device
# APIs (via the Android app) and adb output are both acceptable evidence.
# Software policy (this config): getprop and meminfo are designated mandatory HOST (adb) probes
# for a connected characterization run. This policy is stricter than the protocol: a run is
# FAILED when either host probe fails, even if the Android app supplied the same observation.
# A connected run in which any mandatory probe failed is persisted with run_status FAILED;
# a connected run without such a failure is COMPLETE; a dry run is DRY_RUN.
# ABORTED is listed in the schema but the protocol defines no abort workflow, so the software
# never writes it: an interrupted run raises before characterization.json is written, which
# leaves no result file that could be mistaken for a complete run.
run_status_rules:
  mandatory_probes:
    - getprop   # host probe for device identity: manufacturer, model, API level, release
    - meminfo   # host probe for total RAM used by the 3 GB variant check

output:
  results_directory: "research/results/device_characterization"
  schema_path: "research/experiments/device_characterization_schema.json"
  matrix_path: "research/experiments/device_capability_matrix.md"
