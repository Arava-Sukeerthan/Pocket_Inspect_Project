# Gap-analysis configuration (Step 9.7, revised).
#
# Read by `python scripts/manage_literature.py gap`, which regenerates
#   research/gap_analysis/gap_matrix.csv          (one row per candidate / evidence limitation)
#   research/gap_analysis/combination_matrix.csv  (one row per evaluated combination)
#   research/gap_analysis/gap_candidates.md
# from research/literature/papers.csv and the analysis-only classification files.
#
# Everything here is ANALYSIS-ONLY. Nothing in this file changes the canonical
# literature database (papers.csv), its schema or audit_report.csv.
#
# Unknown is never treated as No. Candidates are not scored, ranked, prioritised
# or selected, and the generator never writes research/gap_analysis/research_gap.md.

schema_version: 2

# The corpus state the narrative text below was written against.
corpus_freeze:
  record: research/gap_analysis/corpus_freeze.md
  git_commit: c6ba9d5185cd4924e4280345142a5dfd4983666d
  papers_sha256: c8fac51d5d80abd25f09816eace1ab840c498af76ade913ce7f7f1ecdc7da521
  record_count: 54

# ---------------------------------------------------------------------------
# Analysis populations (core-analysis subset = full corpus minus both lists)
# ---------------------------------------------------------------------------
populations:
  peripheral_contextual:
    status: researcher-approved
    paper_ids: [P002, P013]
    source: research/literature/fulltext_version_verification.md §13
  review_records:
    status: analysis-only rule (pending researcher review)
    paper_ids: [P010, P024, P026, P035, P036, P052]
    source: '"Paper type: survey/review" in the notes field of papers.csv'

core_subset_rationale:
  - >-
    Rule: core-analysis subset = the 54-record canonical corpus minus the two
    researcher-approved peripheral/contextual records (P002, P013) minus the six
    records whose notes state "Paper type: survey/review" (P010, P024, P026,
    P035, P036, P052). The two lists do not overlap, so 54 - 2 - 6 = 46, which
    matches the subset computed from the data.
  - >-
    P002 and P013 are excluded because the researcher approved them as
    peripheral/contextual, not core (P002: accelerometer-based road-condition
    classification rather than image-based inspection; P013: numeric
    solder-paste measurements predicting X-ray results rather than smartphone
    visual inspection). Their values are still shown per combination in
    combination_matrix.csv (peripheral_results) for transparency.
  - >-
    Review/survey records are excluded because README §7.1 codes them No for
    every characteristic by convention. Those No values describe the review,
    not the evaluated systems, so they must not be read as evidence of absence
    in primary research.
  - >-
    All eight excluded records remain in the canonical 54-record papers.csv.
    The exclusion applies to gap counting only. This rule is an analysis-only
    definition, not a change to the project's relevance methodology; the
    audit A-E classes (audit_report.csv) are proposals and were not used.

# ---------------------------------------------------------------------------
# Derived attributes (not columns of papers.csv)
# ---------------------------------------------------------------------------
derived_attributes:
  visual_inspection_scope:
    status: analysis-only (pending researcher review)
    classification_file: research/gap_analysis/visual_inspection_scope.csv
    column: visual_inspection_scope
    definition:
      yes: >-
        The paper's actual inspection/detection task uses optical image, video
        or camera observations to inspect a physical object, component,
        surface, structure or manufactured/industrial item, and the coded
        fields of papers.csv (application, dataset, hardware, evidence) state
        that input explicitly.
      no: >-
        The paper has no inspection task (e.g. mobile-AI benchmarks,
        adaptive-inference systems on general vision workloads, generic
        selective-prediction methods), or the actual deployed/evaluated input
        is non-visual or non-optical (accelerometer, numeric/tabular
        measurements, magnetic flux leakage, ultrasonic imaging, 3D point
        clouds only).
      unknown: >-
        The paper has an inspection task, but the available coded evidence
        does not establish whether its input is visual.
    rules:
      - >-
        Visual = Yes is not inferred from a camera mention alone, images used
        only for training labels, the use of YOLO or another vision model, the
        words "computer vision" or "segmentation", or a manufacturing domain.
        The actual task input must be stated (e.g. P002: dashcam video only
        labels training data, so No).
      - >-
        Non-optical imaging (ultrasonic, X-ray) and point-cloud-only input are
        No, because PocketInspect concerns camera-based inspection. This
        boundary is a definitional choice for researcher review (affects P021,
        P040, P051).
      - >-
        Camera-viewpoint planning for optical inspection (P041) is Yes; it is
        noted in the basis that no defect detector is evaluated.
      - >-
        Every record has exactly one value and a written basis in
        visual_inspection_scope.csv; the generator rejects missing records,
        invalid values or an empty basis.
  three_d_print_inspection:
    status: analysis-only (pending researcher review)
    definition: >-
      Inspection task on 3D-printed / additively manufactured parts, any
      sensing modality (PocketInspect's initial target application,
      PROJECT_SPEC.md §1). Combine with visual_inspection_scope when visual
      input matters.
    basis: domain = "3D-Print Inspection" in papers.csv
    yes_ids: [P015, P016, P017, P018, P019, P020, P021, P022, P023, P024]
    no_ids: [P001, P002, P003, P004, P005, P006, P007, P008, P009, P010,
             P011, P012, P013, P014, P025, P026, P027, P028, P029, P030,
             P031, P032, P033, P034, P035, P036, P037, P038, P039, P040,
             P041, P042, P043, P044, P045, P046, P047, P048, P049, P050,
             P051, P052, P053, P054]

# ---------------------------------------------------------------------------
# Combinations
# ---------------------------------------------------------------------------
# `criteria` is a list of groups, all of which must hold (AND). A group holds
# if any of its fields is Yes (OR). Group value: Yes if any field is Yes; No if
# every field is No; otherwise Unknown.
# `scope_excludes_no`: records coded No for these fields are outside the
# combination's scope (Unknown stays in scope and is reported as unresolved).
combinations:
  # Primary combinations of the candidate gaps
  - id: C-GC01
    label: Smartphone + visual inspection + runtime adaptation (resource-aware or adaptive)
    dimensions: [1, 4, 5]
    criteria: [[smartphone], [visual_inspection_scope], [resource_awareness, adaptive_inference]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-GC02
    label: Visual inspection + smartphone/edge/on-device + energy or thermal evaluation
    dimensions: [1, 2, 8, 9]
    criteria: [[visual_inspection_scope], [smartphone, edge_device, on_device], [energy_evaluation, thermal_evaluation]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-GC03
    label: Smartphone + visual inspection + runtime adaptation + confidence-triggered downstream action
    dimensions: [1, 4, 5, 12, 13, 15]
    criteria: [[smartphone], [visual_inspection_scope], [adaptive_inference, resource_awareness], [confidence_gating]]
    scope_excludes_no: [visual_inspection_scope]
  # Task combinations A-L
  - id: C-A
    label: Smartphone + visual inspection + on-device inference
    dimensions: [1, 2]
    criteria: [[smartphone], [visual_inspection_scope], [on_device]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-B
    label: Smartphone + visual inspection + resource awareness
    dimensions: [1, 3, 4]
    criteria: [[smartphone], [visual_inspection_scope], [resource_awareness]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-C
    label: Smartphone + visual inspection + adaptive inference
    dimensions: [1, 5]
    criteria: [[smartphone], [visual_inspection_scope], [adaptive_inference]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-D
    label: Smartphone + visual inspection + energy evaluation
    dimensions: [1, 8]
    criteria: [[smartphone], [visual_inspection_scope], [energy_evaluation]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-E
    label: Smartphone + visual inspection + thermal evaluation
    dimensions: [1, 9]
    criteria: [[smartphone], [visual_inspection_scope], [thermal_evaluation]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-F
    label: Smartphone + resource awareness + adaptive inference
    dimensions: [1, 4, 5]
    criteria: [[smartphone], [resource_awareness], [adaptive_inference]]
  - id: C-G
    label: Adaptive inference + energy evaluation + latency evaluation
    dimensions: [5, 7, 8]
    criteria: [[adaptive_inference], [energy_evaluation], [latency_evaluation]]
  - id: C-H
    label: Confidence gating + multi-view (proxy for confidence-triggered additional view)
    dimensions: [11, 12, 13]
    criteria: [[confidence_gating], [multi_view]]
    note: >-
      The schema codes that a confidence gate exists, not which action it
      triggers; actions are read from the evidence text (gap_candidates.md §6).
  - id: C-I
    label: Multi-view + resource awareness
    dimensions: [4, 11]
    criteria: [[multi_view], [resource_awareness]]
  - id: C-J
    label: Anomaly detection + resource awareness
    dimensions: [4, 14]
    criteria: [[anomaly_detection], [resource_awareness]]
  - id: C-K
    label: Smartphone + latency + energy evaluation
    dimensions: [1, 6, 7, 8, 16]
    criteria: [[smartphone], [latency_evaluation], [energy_evaluation]]
    note: >-
      Accuracy reporting (accuracy_metrics) is free text and is never a
      criterion; a blank value is an unresolved field, not absence.
  - id: C-L
    label: Smartphone + visual inspection + runtime adaptation + confidence-aware decision (gating or uncertainty)
    dimensions: [1, 4, 5, 12, 13, 15]
    criteria: [[smartphone], [visual_inspection_scope], [adaptive_inference, resource_awareness], [confidence_gating, uncertainty]]
    scope_excludes_no: [visual_inspection_scope]
  # Supplementary checks
  - id: C-S1
    label: Visual inspection + edge or on-device + energy evaluation
    dimensions: [2, 3, 8]
    criteria: [[visual_inspection_scope], [edge_device, on_device], [energy_evaluation]]
    scope_excludes_no: [visual_inspection_scope]
  - id: C-S2
    label: Adaptive inference + thermal evaluation + energy evaluation
    dimensions: [5, 8, 9]
    criteria: [[adaptive_inference], [thermal_evaluation], [energy_evaluation]]
  - id: C-S3
    label: Uncertainty + edge or on-device inference
    dimensions: [2, 12]
    criteria: [[uncertainty], [edge_device, on_device]]
  - id: C-S4
    label: 3D-print visual inspection + edge or on-device inference
    dimensions: [1, 2, 14]
    criteria: [[three_d_print_inspection], [visual_inspection_scope], [edge_device, on_device]]
    scope_excludes_no: [three_d_print_inspection, visual_inspection_scope]
  - id: C-S5
    label: Visual inspection + edge or on-device + latency evaluation
    dimensions: [2, 6, 7]
    criteria: [[visual_inspection_scope], [edge_device, on_device], [latency_evaluation]]
    scope_excludes_no: [visual_inspection_scope]

# Research dimensions (Step 9.7 task, Part H).
dimensions:
  1: smartphone-based visual inspection
  2: edge/on-device inference
  3: resource-constrained deployment
  4: runtime resource awareness
  5: adaptive inference
  6: accuracy/efficiency trade-offs
  7: latency evaluation
  8: energy evaluation
  9: thermal evaluation
  10: image quality / acquisition robustness
  11: multi-view inspection
  12: uncertainty/confidence-aware decisions
  13: confidence-triggered recapture or additional inspection
  14: anomaly/defect detection
  15: practical PASS/REVIEW inspection decisions
  16: integrated accuracy + latency + energy/resource evaluation

# ---------------------------------------------------------------------------
# Candidates. Unordered. Not scored, ranked, prioritised or selected.
# category: candidate_gap        -> evidence-supported candidate gap
#           evidence_limitation  -> evidence limitation / unresolved question
# Supporting papers, counterexamples and Yes/No/Unknown counts are computed
# from `primary_combination`; the text fields below were written against the
# corpus freeze above.
# ---------------------------------------------------------------------------
candidates:
  - id: GC-01
    category: candidate_gap
    title: >-
      Limited representation of runtime resource-aware/adaptive inference in
      smartphone visual inspection within the reviewed corpus
    dimensions: [1, 2, 4, 5]
    primary_combination: C-GC01
    supplementary_combinations: [C-A, C-B, C-C, C-F]
    description: >-
      Within the frozen corpus, no in-scope core paper is coded Yes for
      smartphone, visual-inspection scope and runtime resource awareness or
      adaptive inference together. The only paper coded Yes for both
      smartphone and visual-inspection scope (P011, version of record read) is
      coded No for resource awareness and adaptive inference. Smartphone papers
      with runtime adaptation (P029, P033, P034 resource-aware and adaptive;
      P031 resource-aware through DVFS only) are all outside the
      visual-inspection scope. For 22 of the 27 in-scope papers the available
      coding is insufficient to determine the combination.
    counterexample_assessment: >-
      No full counterexample. P011 is a partial counterexample (smartphone,
      visual inspection and on-device inference, without runtime adaptation);
      it narrows the candidate to runtime adaptation, not smartphone visual
      inspection as such. P029, P031, P033 and P034 show smartphone runtime
      adaptation for general vision workloads; the candidate is therefore
      limited to its application within visual inspection. P001 (smartphone
      Yes; visual-inspection scope and runtime fields Unknown, full text
      inaccessible) is unresolved and could be a counterexample.
    evidence_basis: >-
      Direct full-text evidence for P011 (version of record), P015, P016, P020
      (versions of record) and P029, P031, P033, P034 (same-version copies).
      P007 is excluded by smartphone = No coded at abstract level. The 22
      unresolved papers are abstract-level records, mostly with smartphone,
      resource awareness and adaptive inference Unknown.
    evidence_limitations: >-
      Only one in-scope paper is coded Yes for smartphone and visual-inspection
      scope. 22 of 27 in-scope papers are unresolved. One search batch, top
      12-15 results per query, no snowballing. visual_inspection_scope is an
      analysis-only classification pending researcher review.
    gap_type: integration (with deployment context)
    evidence_strength: >-
      Limited. A direct corpus observation, but it rests on a single verified
      smartphone visual-inspection paper.
    not_claimed: >-
      That smartphone visual inspection with runtime adaptation does not exist
      in the wider literature.
  - id: GC-02
    category: candidate_gap
    title: >-
      Limited direct evaluation of energy/thermal behaviour in smartphone or
      edge visual inspection within the reviewed corpus
    dimensions: [1, 2, 7, 8, 9, 16]
    primary_combination: C-GC02
    supplementary_combinations: [C-D, C-E, C-S1, C-K]
    description: >-
      Within the frozen corpus, no in-scope core paper is coded Yes for
      visual-inspection scope, smartphone/edge/on-device deployment and an
      energy or thermal evaluation together. Four in-scope papers are coded No
      for both energy and thermal evaluation after full-text review (P011,
      P015, P016, P020). Every core paper coded Yes for energy or thermal
      evaluation is coded No for visual-inspection scope (P006, P028, P029,
      P030, P031, P032, P034). For 23 of the 27 in-scope papers the available
      coding is insufficient to determine the combination.
    counterexample_assessment: >-
      No full counterexample. P007 (visual inspection on an OAK-D/Raspberry Pi
      edge device; energy and thermal Unknown, full text inaccessible) is a
      potential counterexample that cannot be resolved and narrows the
      candidate to "not shown within the corpus". P011 and P016 are one
      criterion short with a coded No.
    evidence_basis: >-
      Direct full-text No values for P011, P015, P016 and P020. The energy and
      thermal Yes values outside the scope come from full text (P029, P031,
      P034) and abstracts (P006, P028, P030, P032).
    evidence_limitations: >-
      Most in-scope papers are coded from abstracts, and abstracts rarely
      report energy or temperature, so their Unknown values must not be read as
      No. Only four in-scope papers have verified No values.
    gap_type: evaluation
    evidence_strength: >-
      Limited. No counterexample is coded, but the observation rests on four
      verified papers and one unresolved potential counterexample (P007).
    not_claimed: >-
      That visual-inspection systems are generally not evaluated for energy or
      thermal behaviour.
  - id: GC-03
    category: candidate_gap
    title: >-
      Limited evidence of integrated smartphone visual inspection combining
      runtime adaptation with confidence-aware downstream decisions
    dimensions: [1, 4, 5, 12, 13, 15]
    primary_combination: C-GC03
    supplementary_combinations: [C-L, C-GC01, C-H]
    description: >-
      Within the frozen corpus, no in-scope core paper combines smartphone
      visual inspection, runtime adaptation and a confidence-triggered
      downstream action, and no paper satisfies three of the four criteria.
      Each component was checked separately (component table below):
      smartphone with visual-inspection scope Yes only in P011, which is coded
      No for runtime adaptation and confidence gating; smartphone runtime
      adaptation only outside the visual-inspection scope (P029, P031, P033,
      P034); confidence gating Yes only in P016 (edge 3D-print system; the
      gate prompts the user to stop the print) and P025 (generic early exit).
    counterexample_assessment: >-
      No full or partial counterexample (no paper meets three of four
      criteria). The broader variant that also accepts uncertainty estimation
      (C-L) has no counterexample either. P001 remains unresolved.
    evidence_basis: >-
      Direct for P011 (version of record). The component separation is
      indirect: it is assembled from the Yes records of each component.
    evidence_limitations: >-
      The coding is insufficient to determine confidence gating for 38 of the
      46 core papers. The combination was never searched as one query. The
      observation depends on the same thin smartphone visual-inspection
      evidence as GC-01.
    gap_type: integration
    evidence_strength: >-
      Limited. The integrated combination does not appear in the corpus, but
      its components are sparsely and mostly abstract-level coded.
    not_claimed: >-
      That no integrated system of this kind exists outside the corpus.

  - id: EL-01
    formerly: GC-04
    category: evidence_limitation
    title: Confidence-triggered recapture or additional view
    dimensions: [11, 12, 13]
    primary_combination: C-H
    description: >-
      The available coding is insufficient to determine confidence gating for
      38 of the 46 core papers. The two papers coded Yes trigger a stop-print
      notification (P016) and an early exit (P025); neither triggers recapture
      or an additional view. The six multi-view papers (P037, P038, P039, P041,
      P042, P043) are Unknown for confidence gating.
    counterexample_assessment: >-
      No coded counterexample. The six multi-view papers are partial
      candidates whose confidence gating is Unknown; any of them could be a
      counterexample.
    evidence_basis: >-
      Gate actions are read from evidence text (full text for P016, abstract
      for P025). The multi-view side is abstract-level only.
    evidence_limitations: >-
      38/46 Unknown for confidence gating; the action type is not a coded
      field; the targeted Batch 1 query on blur/recapture returned 0 hits.
    gap_type: evidence limitation
    evidence_strength: Insufficient to support a gap statement.
    not_claimed: That the 38 Unknown papers do not use confidence gating.
  - id: EL-02
    formerly: GC-05
    category: evidence_limitation
    title: Multi-view inspection under resource-aware or on-device execution
    dimensions: [2, 4, 11]
    primary_combination: C-I
    description: >-
      The six multi-view papers are Unknown for resource awareness, smartphone
      and on-device inference. The resource-aware papers read in full text
      (P029, P031, P033, P034) are coded No for multi-view. For 38 of the 46
      core papers the coding is insufficient to determine the combination.
    counterexample_assessment: >-
      No coded counterexample. Every multi-view paper is a partial candidate
      with resource awareness Unknown.
    evidence_basis: Direct No on the resource-aware side; abstract-level Unknown on the multi-view side.
    evidence_limitations: >-
      The multi-view papers were never read in full text, and deployment
      details are often absent from abstracts.
    gap_type: evidence limitation (possible deployment gap)
    evidence_strength: Insufficient to support a gap statement.
    not_claimed: That multi-view inspection papers do not consider resources.
  - id: EL-03
    formerly: GC-06
    category: evidence_limitation
    title: Anomaly detection with resource-aware runtime or edge deployment
    dimensions: [2, 4, 14]
    primary_combination: C-J
    description: >-
      Every anomaly-detection paper (P009, P037, P038, P040, P043, P047, P050)
      is Unknown for resource awareness. The resource-aware papers read in full
      text are coded No for anomaly detection. For 38 of the 46 core papers the
      coding is insufficient to determine the combination.
    counterexample_assessment: >-
      No coded counterexample. Every anomaly-detection paper is a partial
      candidate with resource awareness Unknown.
    evidence_basis: Abstract-level Unknown on the anomaly side; direct No on the resource-aware side.
    evidence_limitations: >-
      Anomaly-detection papers were not read in full text. Several are datasets
      or benchmarks (P009, P037, P038), for which deployment fields may not
      apply.
    gap_type: evidence limitation (possible deployment gap)
    evidence_strength: Insufficient to support a gap statement.
    not_claimed: That anomaly-detection work does not address resource constraints.
  - id: EL-04
    formerly: GC-07
    category: evidence_limitation
    title: Uncertainty estimation in edge or on-device inspection deployment
    dimensions: [2, 12]
    primary_combination: C-S3
    description: >-
      All nine uncertainty papers (P045-P051, P053, P054) are Unknown for edge
      and on-device inference. The edge/on-device papers read in full text
      (P011, P016, P029, P031, P033, P034) are coded No for uncertainty. For 38
      of the 46 core papers the coding is insufficient to determine the
      combination.
    counterexample_assessment: >-
      No coded counterexample. Every uncertainty paper is a partial candidate
      with deployment Unknown.
    evidence_basis: Abstract-level Unknown on the uncertainty side; direct No on the edge side.
    evidence_limitations: >-
      Uncertainty papers were not read in full text. P045 and P046 are generic
      selective-prediction methods, not inspection systems.
    gap_type: evidence limitation (possible deployment gap)
    evidence_strength: Insufficient to support a gap statement.
    not_claimed: That uncertainty-aware inspection is not deployed on edge devices.
  - id: EL-05
    formerly: GC-08
    category: evidence_limitation
    title: Joint thermal and energy evaluation of adaptive inference
    dimensions: [5, 8, 9]
    primary_combination: C-S2
    supplementary_combinations: [C-G]
    description: >-
      No core paper is coded Yes for adaptive inference, thermal and energy
      evaluation together. P032 (adaptive inference and thermal evaluation Yes)
      is one criterion short with energy evaluation Unknown, and its full text
      was inaccessible. P028 and P030 are one criterion short with thermal
      evaluation Unknown. Adaptive inference with energy and latency
      evaluation (C-G) has counterexamples (P028, P029, P034).
    counterexample_assessment: >-
      No full counterexample, but P032, P028 and P030 are unresolved partial
      counterexamples. P032 in particular may resolve the question.
    evidence_basis: >-
      Direct for P029, P031, P034 (full text); unresolved for P028, P030 and
      P032 (abstract-level; P032 full text inaccessible).
    evidence_limitations: >-
      Hinges on P032, whose full text could not be obtained; only two core
      papers are coded Yes for thermal evaluation.
    gap_type: evidence limitation
    evidence_strength: Insufficient; absence is not established.
    not_claimed: That adaptive inference has not been evaluated for joint thermal and energy behaviour.
  - id: EL-06
    formerly: GC-09
    category: evidence_limitation
    title: Image quality / acquisition robustness and PASS/REVIEW decision outputs
    dimensions: [10, 15]
    description: >-
      These dimensions are not coded in papers.csv, so the frozen corpus
      cannot show whether papers address them. One targeted Batch 1 query
      ("image quality assessment defect inspection blur recapture") returned 0
      hits; a single zero-hit query is not evidence of absence.
    evidence_basis: papers.csv schema (no field); search_log.md Batch 1 §1b (one G6 query, 0 hits).
    evidence_limitations: >-
      A coding and search limitation. Assessing it needs new coding fields or
      a dedicated search, both outside Step 9.7.
    gap_type: evidence/search limitation
    evidence_strength: Not assessable from the frozen corpus.
    not_claimed: That the literature lacks image-quality or acquisition-robustness evaluation.

counterexample_notes:
  - "C-A (smartphone + visual inspection + on-device): P011 meets all criteria. It is a counterexample to any claim about smartphone on-device visual inspection as such."
  - "C-F (smartphone + resource awareness + adaptive inference): P029, P033, P034 meet all criteria (general vision workloads)."
  - "C-G (adaptive inference + energy + latency): P028, P029, P034 meet all criteria."
  - "C-K (smartphone + latency + energy): P029, P034 meet all criteria (general workloads)."
  - "C-S4 (3D-print visual inspection + edge/on-device): P016 meets all criteria (Raspberry Pi 4)."
  - "C-S5 (visual inspection + edge/on-device + latency): P007 and P016 meet all criteria."
  - "Combinations with all-Yes records were not proposed as candidate gaps."

confidence_gating_actions:
  P016: "Probability above a predefined value prompts the user to stop the print (full text; human referral/stop decision)."
  P025: "High-confidence predictions exit early from the network (abstract; early exit)."

search_limitations:
  - "One search batch (2026-10-01): OpenAlex primary search with Crossref verification, publication date >= 2016."
  - "Only the top 15 (broad queries) or top 12 (targeted queries) results were screened per query, plus 11 known-item lookups."
  - "No citation snowballing; no IEEE Xplore, Scopus or Web of Science search."
  - "Publisher access was limited: ACM DL, ScienceDirect, doi.org and several repositories were blocked in this environment."
  - "Full-text coverage: 10 of 54 records were read in full text. Of the other 44, eight were queued for full text but blocked (P001, P007, P017, P032 inaccessible; P018, P019, P022, P023 abstract only) and 36 were never queued, so 44 records are coded at abstract level."
  - "Version limitations: P029, P031 and P033 were read from same-version camera-ready or journal-layout copies (ACM PDFs not compared); P011 Fig. 4 labels were read in arXiv v2 only."
  - "P013 Tables 4-5 remain visually unverified (see §8)."
  - "These limitations bound what the corpus can show. They are not evidence of any research gap."

p013_unresolved:
