# Step 10C-DR final freeze: pre-data-collection decisions.
#
# `frozen_now` holds rules and the two approved numerical values (alpha 0.05,
# target power 0.80). Everything else is listed as PILOT-DEPENDENT,
# DEVICE-VERIFICATION DEPENDENT or REQUIRES FUTURE APPROVAL and has no value
# here. No measurement, threshold, effect size or sample size is stored.
# Canonical register: research/experiments/pre_data_collection_decision_register.md

step: 10C-DR (final freeze)
status_values:
- RESOLVED
- PRE-DATA-COLLECTION FREEZE
- PILOT-DEPENDENT
- DEVICE-VERIFICATION DEPENDENT
- DEFERRED
- NOT APPLICABLE
freeze_categories:
- FROZEN NOW
- PILOT-DEPENDENT
- DEVICE-VERIFICATION DEPENDENT
- REQUIRES FUTURE APPROVAL
freeze_points:
- FP-0
- FP-1
- FP-2
- FP-3
- FP-4
unchanged:
- GC-03
- RQ1
- B1
- B2
- B3
- B4
- B5
- B5-F_ablation
- recovery_metric
frozen_now:
  D-02:
    alpha: 0.05
    sidedness: two-sided
    multiple_comparison: Holm
    family:
    - H1
    - H2
    - H3
    - H4
    - H5
    approval: researcher, Step 10C-DR final freeze (new pre-data-collection decision)
  D-03:
    target_power: 0.8
    sample_size: PILOT-DEPENDENT
    runs_treated_as_independent: false
  D-04:
    primary_cost_metric: median_steady_state_per_item_latency_at_R0_on_device
    secondary_roles:
      peak_memory: admissibility_gate
      energy_per_item: order_confirmation_if_validated
      thermal_rise: reported
      cpu_gpu_utilisation: reported
    composite_score: not_used
    tie_rule:
    - cluster_bootstrap_latency_ci_includes_zero
    - lower_peak_memory
    - higher_validation_recall
    minimum_rungs_for_adaptation: two_or_more_admissible_rungs_else_stop_and_report
    ladder_identities: TO BE EMPIRICALLY DETERMINED
  D-05:
    floors:
    - auroc_lower_ci_above_no_skill
    - precision_lower_ci_above_validation_prevalence
    - recall_lower_ci_above_false_positive_rate
    evaluation_split: validation
    requirement_based_floor: DEFERRED
  D-06:
    procedure: risk_controlled_selective_acceptance_on_calibration_tau
    confidence: configuration_specific_temperature_scaling
    risk_target: single_acceptance_risk_target_for_all_configurations
    candidate_thresholds: sorted_distinct_calibrated_confidences_on_calibration_tau
    selection: smallest_candidate_with_upper_clopper_pearson_selective_error_at_most_risk_target
    tie_rule: higher_threshold
    infeasible: verify_all_subject_to_D-07_limit_and_report_infeasible
    coverage: reported_per_configuration
    b4_configuration: same_as_B2
    b5f_rule: same_procedure_and_target_on_pooled_calibration_tau_outputs_equal_weight
    uses_test_set: false
    anchored_to_C1_equivalence: false
  D-08:
    primary_fusion: max_calibrated_defect_probability_across_considered_views
    sensitivity_fusion: mean_calibrated_probability
    condition: V-05_confirms_item_label_is_any_view_anomalous
  D-09_procedure:
    unit: physical_item
    stratification:
    - object_category
    - defect_status
    official_real_iad_split_reused: false
    allocation_order:
    - test_from_D-03
    - calibration_tau_from_D-06_feasibility
    - calibration_T_equal_to_calibration_tau
    - validation
    - train_remainder
    leakage_checks:
    - no_item_in_two_splits
    - all_views_same_split
    - manifests_hashed
  D-10_rule:
    dimensions:
    - thermal
    - battery
    - memory
    - compute
    excluded_from_state:
    - latency
    - accuracy
    - confidence
    aggregation: maximum_of_dimension_levels
    unavailable_dimension: removed_for_whole_study_at_FP-1
    transient_gap: hold_last_valid_level_and_flag_telemetry_gap
    escalation: may_skip_levels
    de_escalation: one_level_at_a_time
    thermal_platform_api_assumed: false
    thermal_fallback: temperature_signals_and_frequency_capping_evidence_with_E0_thresholds
  D-14:
    unit_accuracy: item_aggregated_across_runs
    test: paired_item_level_sign_flip_permutation
    ci: item_cluster_bootstrap
    sensitivity: logistic_mixed_model_item_and_run_random_intercepts
    mcnemar_valid_only_for:
    - one_paired_observation_per_item_e.g._E1_deterministic
    - single_run_sensitivity
    unit_cost: counterbalanced_run_block
    cost_test: paired_wilcoxon_signed_rank
    runs_treated_as_independent: false
  D-15:
    primary_recovery_metric: item_level_defect_recall
    h2_support_requires:
    - recall_recovery
    - precision_non_inferiority_B5_vs_B3
    precision_margin: from_D-01
    secondary:
    - f1_recovery
    - false_reject_rate
    - false_accept_rate
    - referral_rate
    - coverage
  D-16:
    energy_agreement_method: bland_altman_with_proportional_bias_check
    external_energy_validation_required: true
    network: fully_offline_airplane_mode_wifi_bluetooth_data_off
    usb_during_battery_runs: disconnected
    inference: on_device_only
    experimental_platforms:
    - OPPO A5 2020 (3 GB RAM variant)
    multi_device_validation: future_work_not_in_scope
    energy_reference_preferred: battery_side_external_reference
    energy_fallback_levels:
    - E-1_battery_side_reference
    - E-2_supply_powered_external_session
    - E-3_software_relative_only_no_absolute_energy
    absolute_energy_forced: false
    software_counters_ground_truth: false
  D-12:
    separate_quantities:
    - inference_latency
    - verification_latency
    - total_decision_time
    verification_forced_into_C1_inference_latency: false
    verification_overhead_reported_separately: true
    human_review_in_device_time: false
    inference_admissibility_reference_rule: median_C1_inference_latency_at_R0_on_validation
    total_decision_budget_in_primary_design: false
pilot_dependent:
  D-01:
    freeze_point: FP-1
    note: NO NUMERICAL VALUE IS JUSTIFIED BEFORE PILOT CHARACTERIZATION
  D-03_sample_size:
    freeze_point: FP-1
  D-07_order:
    freeze_point: FP-2
  D-09_sizes:
    freeze_point: FP-1
  D-10_thresholds:
    freeze_point: FP-1
  D-11:
    freeze_point: FP-1
    provisional_primary: scripted_background_compute_load
  D-12_inference_reference:
    freeze_point: FP-2
  D-13:
    freeze_point: FP-1
  D-15_margin:
    freeze_point: FP-1
  D-16_measured_agreement:
    freeze_point: FP-1
device_verification_dependent:
  D-10_thermal_source:
    verified_in: Step 10D
    options:
    - platform_thermal_status_if_API_29_or_later
    - fallback_temperature_and_frequency_capping
  D-16_energy_level:
    verified_in: Step 10D
    options:
    - E-1
    - E-2
    - E-3
  D-16_on_device_trace:
    verified_in: Step 10D
  D-13_low_memory_behaviour:
    verified_in: Step 10D
  D-11_process_stability:
    verified_in: Step 10D
requires_future_approval:
  D-06_risk_target:
    freeze_point: FP-0
  D-16_agreement_threshold:
    freeze_point: FP-0
    status: PRE-DATA-COLLECTION DECISION REQUIRED
  D-12_total_decision_budget:
    freeze_point: FP-2
    only_if_needed: true
  D-10_thermal_status_mapping:
    freeze_point: Step 10D
    only_if_api_available: true
  D-05_requirement_floor:
    status: DEFERRED
  ece_binning_rule:
    freeze_point: FP-0
