  Q8:
    question: "Can the potential contribution be distinguished from merely combining existing components?"
    allowed: [distinct_enough, conditionally_distinct, not_sufficiently_distinct]
    result: conditionally_distinct
  Q10:
    question: "Could additional literature reasonably overturn GC-03?"
    allowed: [low, moderate, high]
