    status: unresolved
    counterexample_strength: potential
  P007:
    full_text_accessed: false
    access_attempts: ["onlinelibrary.wiley.com (blocked)", "downloads.hindawi.com (blocked)", "structurae.de (blocked)"]
    evidence_level: abstract_only
    status: unresolved
    counterexample_strength: partial
