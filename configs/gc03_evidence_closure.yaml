# Strength rules used in this step (Step 9.9B task, Part VI), applied with the
# Step 9.8 vocabulary in configs/gap_evaluation.yaml.
strength_rules:
  full: "All five criteria Yes."
  potential: "No criterion clearly failed, and one or more criteria Unknown at the available evidence level."
  partial: "At least one criterion clearly failed (explicit No)."
  not_counterexample: "Verified not to concern the GC-03 combination (wrong task, platform and mechanism)."

