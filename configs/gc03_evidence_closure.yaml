    full_text_accessed: true
    review_mode: full_text_read_end_to_end
    source: "PubMed Central PMC11435656 (doi 10.3390/s24185921)"
    evidence_level: verified_full_text
    counterexample_strength: partial
    findings:
      smartphone: "No: three Raspberry Pi 4 edge devices plus a cloud server"
      visual_inspection: "Yes: camera video stream of PCBs"
      resource_awareness: "No: routing is driven by detection confidence only; the three-device split is design-time"
      adaptive_inference: "Yes: low-confidence samples follow a different computation path (Pi B, then cloud YoloV5s)"
      confidence_gating: "Yes: confidence below 0.6 triggers re-detection and cloud review"
  ActiveInspect:
    id: "doi:10.3390/s26154932"
    full_text_accessed: true
    review_mode: full_text_read_end_to_end
    source: "PubMed Central PMC13468834"
    evidence_level: verified_full_text
    counterexample_strength: partial
    findings:
      smartphone: "No: one A100 80 GB for inference, pre-acquired observation pools"
      visual_inspection: "Yes: RGB and geometric renderings of industrial parts"
      resource_awareness: "No: the observation budget is a fixed task hyperparameter; no device state is used"
      adaptive_inference: "Yes: sample-adaptive number of views and VLM calls"
      confidence_gating: "Unknown (researcher decision): confidences enter the learned policy's memory and correlate with action A3, but no explicit trigger rule exists"
    researcher_decision_required: "Whether confidence that informs a learned policy without an explicit trigger counts as confidence_gating (Decision B 'explicitly informs' vs Step 9.9B 'explicitly triggers'). Either reading leaves the paper partial."

# Gate answers for GC-03 only. Allowed values are listed per question.
gate_answers:
