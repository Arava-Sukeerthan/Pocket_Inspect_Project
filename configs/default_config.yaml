# PocketInspect System Default Configuration
#
# STATUS: Phase 1 scaffold. NOT a confirmatory configuration.
# - No code in src/, scripts/, experiments/, mobile/ or tests/ other than the placeholder guard test loads this file
#   (traced 2026-10-13).
# - The values listed under `config_status.unresolved_placeholders` are scaffold placeholders from the initial
#   repository commit. They are not research values and were not derived from any measurement.
# - `src.config.load_confirmatory_config` rejects this file while `config_status` reports it unresolved.

config_status:
  confirmatory_ready: false
  unresolved_placeholders:
    uncertainty.confidence_threshold: "D-06: selected per configuration by the risk-controlled procedure on calibration-tau; the risk target requires future approval (FP-0)"
    adaptation.thermal_limit_celsius: "D-10: R0-R3 thresholds are pilot-dependent (FP-1); the thermal source is device-verification-dependent"
    adaptation.battery_low_threshold_pct: "D-10: R0-R3 thresholds are pilot-dependent (FP-1)"

project:
  name: "PocketInspect"
  version: "0.1.0"
  target_application: "3D-printed part visual inspection"

acquisition:
  target_fps: 15
  resolution: [1920, 1080]
  color_space: "RGB"
  exposure_mode: "auto"

quality:
  blur_threshold: 100.0  # Laplacian variance threshold
  min_illumination: 30.0
  max_illumination: 220.0

inference:
  runtime: "onnxruntime"  # options: onnxruntime, tflite
  device_target: "cpu"    # options: cpu, gpu, npu
  precision: "fp32"       # options: fp32, fp16, int8
  thread_count: 4

adaptation:
  thermal_limit_celsius: 45.0  # UNRESOLVED PLACEHOLDER (see config_status)
  battery_low_threshold_pct: 20  # UNRESOLVED PLACEHOLDER (see config_status)
  enable_dynamic_resolution: true
  enable_frame_skipping: true

uncertainty:
  confidence_threshold: 0.85  # UNRESOLVED PLACEHOLDER (see config_status)
  ood_method: "entropy"  # options: entropy, energy, temperature_scaling
