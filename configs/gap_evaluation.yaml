    - "no existing work"
    - "no existing research"
    - "first to"
    - "the first"
    - "novel contribution"
    - "is novel"
    - "unprecedented"
    - "never been studied"
    - "never been done"
    - "has not been studied"
    - "research gap is"
    - "final research gap"
    - "selected gap"
    - "recommended candidate"
    - "we recommend gc"
    - "ranked first"
    - "best candidate"
    - "strongest candidate"
    - "winner"
    - "preferred candidate"
    - "recommended gap"
