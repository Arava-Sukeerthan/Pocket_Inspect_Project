  partial: "Meets some components with verified evidence; at least one component is absent or out of scope."
  potential: "Could meet the candidate, but key components are Unknown at the available evidence level."
  not_counterexample: "Verified or clearly indicated not to meet the candidate (wrong task, platform or missing component)."

