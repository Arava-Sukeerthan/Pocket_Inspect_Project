unknown_burden_values: ["low", "moderate", "high", "not_applicable"]

# Evaluation dimensions. For each: the evidence required, what counts as strong
# evidence, what counts as weak evidence, and what disqualifies or weakens a candidate.
dimensions:
  - id: literature_evidence_strength
    name: Literature evidence strength
    evidence_required: "Corpus Yes/No/Unknown counts for the candidate's fields within the visual-inspection scope, with the evidence level behind each value."
    strong_evidence: "Most in-scope values are full-text-verified No for the candidate's missing component, and the candidate's components are each present in verified Yes records."
    weak_evidence: "In-scope values are mostly Unknown or abstract-level; the observation rests on a few verified records."
    disqualifying_or_weakening: "Verified in-scope Yes records for every component (a full counterexample), or Unknown so dominant that the observation is a coding artefact."
  - id: unknown_burden
    name: Unknown burden
    evidence_required: "Share of in-scope records with Unknown for the candidate's fields, and whether full text could resolve them."
    strong_evidence: "Unknowns are few, or are confined to records whose full text was checked and still does not report the field."
    weak_evidence: "Unknowns dominate the in-scope set and are abstract-level."
    disqualifying_or_weakening: "Any Unknown record that, if resolved to Yes, would make a full counterexample."
  - id: counterexample_risk
    name: Counterexample risk
    evidence_required: "Results of the targeted disproof searches: full, partial and potential counterexamples, with evidence levels."
    strong_evidence: "Targeted searches found no full counterexample, and the partial ones are verified and differ in a named component."
    weak_evidence: "Searches were narrow or access-limited, or potential counterexamples remain unresolved."
    disqualifying_or_weakening: "A verified full counterexample; several partial counterexamples that differ only in a minor component."
  - id: pocketinspect_alignment
    name: Direct PocketInspect alignment
    evidence_required: "Mapping of the candidate's components to modules and phases in PROJECT_SPEC.md."
    strong_evidence: "Every component maps to a specified module and phase."
    weak_evidence: "Only some components map, or they map to later or optional phases."
    disqualifying_or_weakening: "The candidate requires capabilities outside the project scope."
  - id: research_feasibility
    name: Research feasibility
    evidence_required: "Whether the question can be answered within the project's resources and constraints (no heavy training without approval; smartphone hardware)."
    strong_evidence: "The question can be studied with available devices, public data and lightweight models."
    weak_evidence: "Feasibility depends on unconfirmed hardware access, data or instrumentation."
    disqualifying_or_weakening: "Requires resources the project cannot obtain."
  - id: smartphone_measurability
    name: Smartphone measurability
    evidence_required: "Whether the candidate's outcome variables can be measured on an Android smartphone with documented instruments or APIs."
    strong_evidence: "Outcomes are measurable with standard Android facilities or external instruments described in the literature."
    weak_evidence: "Measurement depends on vendor-specific counters of uncertain accuracy."
    disqualifying_or_weakening: "Key outcomes cannot be measured on the device."
  - id: dataset_feasibility
    name: Dataset feasibility
    evidence_required: "Availability of public optical inspection datasets and the need for project-captured data."
    strong_evidence: "Public datasets exist for the components, and missing parts can be captured with a phone."
    weak_evidence: "The required data (multi-view captures, recapture sequences) must be collected from scratch."
    disqualifying_or_weakening: "No feasible data source for an essential component."
  - id: experimental_feasibility
    name: Experimental feasibility
    evidence_required: "Whether controlled experiments (conditions, repetitions, measurements) can be designed and run."
    strong_evidence: "Controlled conditions and repeated measurements are practical."
    weak_evidence: "Experiments are sensitive to uncontrolled factors (ambient temperature, background load, user handling)."
    disqualifying_or_weakening: "No reproducible protocol is possible."
  - id: baseline_availability
    name: Baseline availability
    evidence_required: "Existence of comparable static, non-adaptive or non-gated baselines and of published methods to compare against."
    strong_evidence: "Static baselines are trivial to define and published comparators exist."
    weak_evidence: "Only self-defined baselines are possible."
    disqualifying_or_weakening: "No meaningful baseline."
  - id: ablation_potential
    name: Ablation potential
    evidence_required: "Whether components can be removed or varied to attribute effects."
    strong_evidence: "Each component can be switched off independently."
    weak_evidence: "Components are entangled."
    disqualifying_or_weakening: "No component can be isolated."
  - id: quantitative_evaluation_potential
    name: Quantitative evaluation potential
    evidence_required: "Availability of quantitative outcome measures (accuracy, latency, energy, temperature, referral rate)."
    strong_evidence: "Several standard, reproducible measures apply."
    weak_evidence: "Measures are ad hoc or noisy."
    disqualifying_or_weakening: "Only qualitative outcomes."
  - id: engineering_complexity
    name: Expected engineering complexity
    evidence_required: "Components to build (models, runtime controller, measurement harness, app) relative to the project plan."
    strong_evidence: "Builds on components already planned in PROJECT_SPEC.md."
    weak_evidence: "Requires several new subsystems."
    disqualifying_or_weakening: "Complexity beyond the project timeline."
  - id: contribution_depth
    name: Potential contribution depth
    evidence_required: "What kind of contribution the candidate could support (measurement study, method, system integration), stated without novelty claims."
    strong_evidence: "Admits a clearly defined, testable research question with measurable outcomes."
    weak_evidence: "Admits mainly an engineering integration or a single measurement."
    disqualifying_or_weakening: "The question is already answered by verified literature."
  - id: publication_relevance
    name: Publication relevance
    evidence_required: "Venues and communities where the verified related work appears."
    strong_evidence: "Related verified work appears in established venues, and the candidate fits their scope."
    weak_evidence: "Relevance relies on preprints or grey literature."
    disqualifying_or_weakening: "No identifiable venue."

guards:
